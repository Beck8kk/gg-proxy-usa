<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Proxy USA - Web Proxy</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #1a1d29;
            --primary: #00d2ff;
            --primary-hover: #00b8e6;
            --text-main: #e0e0e0;
            --text-muted: #8b95a1;
            --border: #2d3343;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, #1e2433 0%, var(--bg-dark) 70%);
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #fff;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.go-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.go-btn:hover {
            background: var(--primary-hover);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .quick-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quick-btn:hover {
            background: var(--bg-dark);
            border-color: var(--primary);
            color: var(--primary);
        }

        .badge {
            background: #2e7d32;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GG <span>Proxy</span> USA</h1>
        <p class="subtitle">Navegue como se estivesse nos Estados Unidos 🇺🇸</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://now.gg" value="https://now.gg">
            <button class="go-btn" onclick="launchProxy()">GO</button>
        </div>

        <div class="quick-links">
            <button class="quick-btn" onclick="launchProxy('https://now.gg/roblox')">
                🎮 Roblox
            </button>
            <button class="quick-btn" onclick="launchProxy('https://now.gg/free-fire')">
                🔥 Free Fire
            </button>
            <button class="quick-btn" onclick="launchProxy('https://now.gg/stumble-guys')">
                🎲 Stumble Guys
            </button>
        </div>

        <div class="footer">
            Server: United States (AWS us-east-1) | Powered by GG Proxy
        </div>
    </div>

    <script>
        function launchProxy(url) {
            // Se já tiver um prefixo de proxy, limpa
            if (url.startsWith('/proxy')) {
                return;
            }
            // Garante que a URL comece com http
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            // Navega para a URL de proxy
            window.location.href = `/proxy?url=${encodeURIComponent(url)}`;
        }

        // Enter key support
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                launchProxy(this.value);
            }
        });
    </script>
</body>
</html>
