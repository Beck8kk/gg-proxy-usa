<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>GG Proxy USA</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1d29;
            --primary: #00d2ff;
            --text: #e0e0e0;
            --border: #2d3343;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e2433 0%, var(--bg) 70%);
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        h1 { text-align: center; margin-top: 0; font-size: 2.2rem; }
        h1 span { color: var(--primary); }
        .subtitle { text-align: center; color: #8b95a1; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: white;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        .go-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .go-btn:hover { background: #00b8e6; }
        .quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .quick-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .quick-btn:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }
        .footer { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #8b95a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GG <span>Proxy</span> USA</h1>
        <p class="subtitle">Navegue como se estivesse nos Estados Unidos 🇺🇸</p>
        
        <form id="proxyForm" onsubmit="event.preventDefault(); launchProxy()">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://now.gg" value="https://now.gg">
                <button type="submit" class="go-btn">GO</button>
            </div>
        </form>

        <div class="quick-links">
            <button class="quick-btn" onclick="launchProxy('https://now.gg/roblox')">🎮 Roblox</button>
            <button class="quick-btn" onclick="launchProxy('https://now.gg/free-fire')">🔥 Free Fire</button>
            <button class="quick-btn" onclick="launchProxy('https://now.gg/stumble-guys')">🎲 Stumble Guys</button>
        </div>

        <div class="footer">Server: United States | Powered by GG Proxy</div>
    </div>

    <script>
        function launchProxy(url) {
            if (!url) {
                url = document.getElementById('urlInput').value;
            }
            
            // Limpeza básica da URL
            url = url.trim();
            if (!url) return;
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // Evita loops se já estiver no proxy
            if (url.includes('/proxy?url=')) {
                const decoded = decodeURIComponent(url.split('url=')[1]);
                url = decoded;
            }

            window.location.href = `/proxy?url=${encodeURIComponent(url)}`;
        }
    </script>
</body>
</html>
